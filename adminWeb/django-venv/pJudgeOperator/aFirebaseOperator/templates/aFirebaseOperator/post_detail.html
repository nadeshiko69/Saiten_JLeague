{% extends "aFirebaseOperator/base.html" %}
{% block content %} 
    <h1 class="title"> {{post.title}} </h1>
    <p>{{post.intro}}</p>
    <hr />

    <!-- コメント -->
    <h2 class="subtitle"> コメントを追加 </h2>

    <form action="." method="post">
        {% csrf_token %}<!-- セキュリティ用タグ、form追加時は書く -->
        {{form.as_p}}
        <div class="field">
            <div class="control">
                <button class="button is-danger">送信</button>
            </div>
        </div>
    </form>
{% endblock %}
