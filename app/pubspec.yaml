name: judge
description: judge J-League player.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.2+1

environment:
  sdk: ">=2.15.0-35.0.dev <3.0.0"
dependencies:
  flutter:
    sdk: flutter
  # firebase
  firebase_core: ^2.4.1
  firebase_auth: ^4.2.2
  cloud_firestore: ^4.3.1
  # AdMob
  admob_flutter: ^3.0.0
  freezed_annotation: ^2.2.0
  # Stripe
  flutter_stripe: ^7.0.0
  # other
  cupertino_icons: ^1.0.2
  intl: ^0.18.0
  provider: ^6.0.2
  badges: ^2.0.1
  flutter_dotenv: ^5.0.2
  flutter_svg: ^1.1.5
  flutter_launcher_icons: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  # AdMob
  build_runner: ^2.3.3
  freezed: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - lib/_images/
    - lib/.env # For Stripe

flutter_icons:
  android: true
  ios: true
  image_path: "lib/_images/_Icon.png"